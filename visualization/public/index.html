<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="The Ethereum Life Form - Evolution on the Blockchain"
    />
    <title>The Ethereum Life Form 🧬</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
        overflow: hidden;
      }

      code {
        font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New',
          monospace;
      }

      #root {
        width: 100vw;
        height: 100vh;
      }

      /* Loading animation */
      .loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #00ffff;
        font-size: 24px;
        text-align: center;
      }

      .dna-loader {
        display: inline-block;
        position: relative;
        width: 80px;
        height: 80px;
      }

      .dna-loader div {
        position: absolute;
        width: 6px;
        height: 6px;
        background: #00ffff;
        border-radius: 50%;
        animation: dna-loader 1.2s linear infinite;
      }

      .dna-loader div:nth-child(1) {
        animation-delay: 0s;
        top: 37px;
        left: 66px;
      }

      .dna-loader div:nth-child(2) {
        animation-delay: -0.1s;
        top: 22px;
        left: 62px;
      }

      .dna-loader div:nth-child(3) {
        animation-delay: -0.2s;
        top: 11px;
        left: 52px;
      }

      .dna-loader div:nth-child(4) {
        animation-delay: -0.3s;
        top: 7px;
        left: 37px;
      }

      .dna-loader div:nth-child(5) {
        animation-delay: -0.4s;
        top: 11px;
        left: 22px;
      }

      .dna-loader div:nth-child(6) {
        animation-delay: -0.5s;
        top: 22px;
        left: 11px;
      }

      .dna-loader div:nth-child(7) {
        animation-delay: -0.6s;
        top: 37px;
        left: 7px;
      }

      .dna-loader div:nth-child(8) {
        animation-delay: -0.7s;
        top: 52px;
        left: 11px;
      }

      .dna-loader div:nth-child(9) {
        animation-delay: -0.8s;
        top: 62px;
        left: 22px;
      }

      .dna-loader div:nth-child(10) {
        animation-delay: -0.9s;
        top: 66px;
        left: 37px;
      }

      .dna-loader div:nth-child(11) {
        animation-delay: -1s;
        top: 62px;
        left: 52px;
      }

      .dna-loader div:nth-child(12) {
        animation-delay: -1.1s;
        top: 52px;
        left: 62px;
      }

      @keyframes dna-loader {
        0%, 20%, 80%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.5);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="loading">
        <div class="dna-loader">
          <div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div>
          <div></div><div></div><div></div><div></div>
        </div>
        <div>Loading Evolution...</div>
      </div>
    </div>
  </body>
</html>
